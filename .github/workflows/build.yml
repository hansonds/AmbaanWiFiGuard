name: Build EXE

# Actions tab > Build EXE > Run workflow:
#   - type a version (e.g. 2.0.1) -> builds and publishes a GitHub Release v2.0.1
#   - leave it empty              -> test build, files only under the run's Artifacts
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 2.0.1). Empty = test build only'
        required: false
        default: ''

permissions:
  contents: write

env:
  APP_NAME: Ambaan WiFi Guard
  APP_ID: AmbaanWiFiGuard
  APP_PUBLISHER: Phoenicx
  APP_URL: https://phoenicx.org

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Version
        shell: pwsh
        run: |
          $in = '${{ github.event.inputs.version }}'.Trim().TrimStart('v')
          $v = if ($in) { $in } elseif ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } else { "0.0.$env:GITHUB_RUN_NUMBER" }
          "VERSION=$v" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Device maker list (MAC -> brand)
        shell: pwsh
        continue-on-error: true
        run: |
          # Wireshark's public list of network card makers. Packed into the EXE so lookups work offline.
          Invoke-WebRequest 'https://www.wireshark.org/download/automated/data/manuf' -UseBasicParsing -TimeoutSec 60 -OutFile manuf.txt
          $raw = [IO.File]::ReadAllText("$PWD\manuf.txt")
          $sb = [System.Text.StringBuilder]::new()
          foreach ($line in $raw -split "`n") {
            if ($line -match '^([0-9A-Fa-f]{2}):([0-9A-Fa-f]{2}):([0-9A-Fa-f]{2})\s*\t\s*([^\t\r]+?)\s*(?:\t\s*([^\r\n]+?))?\s*$') {
              $name = if ($Matches[5]) { $Matches[5].Trim() } else { $Matches[4].Trim() }
              [void]$sb.Append(($Matches[1] + $Matches[2] + $Matches[3]).ToUpper() + "`t" + $name + "`n")
            }
          }
          $bytes = [Text.Encoding]::UTF8.GetBytes($sb.ToString())
          $out = [IO.File]::Create("app\Resources\oui.txt.gz")
          $gz = [IO.Compression.GZipStream]::new($out, [IO.Compression.CompressionLevel]::Optimal)
          $gz.Write($bytes, 0, $bytes.Length); $gz.Close(); $out.Close()
          "OUI entries: " + ($sb.ToString() -split "`n").Count

      - name: Build app
        shell: pwsh
        run: |
          dotnet build app\AmbaanWiFiGuard.csproj -c Release "-p:Version=$env:VERSION" -nologo
          if ($LASTEXITCODE) { throw 'build failed' }
          New-Item -ItemType Directory -Force build, dist | Out-Null
          Copy-Item app\bin\Release\net48\AmbaanWiFiGuard.exe build\AmbaanWiFiGuard.exe
          Copy-Item build\AmbaanWiFiGuard.exe "dist\$env:APP_ID-Portable-$env:VERSION.exe"
          "installed" | Set-Content build\installed.flag
          Get-ChildItem app\bin\Release\net48 | Format-Table Name, Length

      - name: Build Setup EXE (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc "/DAppName=$env:APP_NAME" "/DAppId=$env:APP_ID" "/DAppVersion=$env:VERSION" "/DAppPublisher=$env:APP_PUBLISHER" "/DAppUrl=$env:APP_URL" installer\setup.iss
          if ($LASTEXITCODE) { throw 'Inno Setup failed' }
          Get-ChildItem dist | Format-Table Name, Length

      - name: Smoke test (start the app, take screenshots, check the log)
        shell: pwsh
        continue-on-error: true
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          New-Item -ItemType Directory -Force smoke\AmbaanWiFiGuard-data\MonitorData, shots | Out-Null
          Copy-Item build\AmbaanWiFiGuard.exe smoke\
          '{"Expanded":true,"AutoStart":false,"AutoStartAsked":true}' | Set-Content smoke\AmbaanWiFiGuard-data\MonitorData\WidgetSettings.json
          function Shot($name) {
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp); $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save("shots\$name.png"); $g.Dispose(); $bmp.Dispose()
          }
          foreach ($v in 'widget', 'alert-new', 'alert-slow', 'settings', 'history', 'dns', 'network') {
            $arg = if ($v -eq 'widget') { '' } else { "--show=$v" }
            $p = Start-Process smoke\AmbaanWiFiGuard.exe -ArgumentList $arg -PassThru
            Start-Sleep -Seconds 14
            Shot $v
            "$v : running=" + (-not $p.HasExited)
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            Start-Sleep -Seconds 2
          }
          "----- App.log -----"
          Get-Content smoke\AmbaanWiFiGuard-data\MonitorData\App.log -ErrorAction SilentlyContinue

      - name: Save screenshots to the ci-screenshots branch
        shell: pwsh
        continue-on-error: true
        run: |
          Copy-Item smoke\AmbaanWiFiGuard-data\MonitorData\App.log shots\App.log -ErrorAction SilentlyContinue
          Set-Location shots
          git init -q -b ci-screenshots
          git -c user.name=ci -c user.email=ci@example.com add -A
          git -c user.name=ci -c user.email=ci@example.com commit -qm "screenshots $env:VERSION"
          git push -f -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-screenshots

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_ID }}-${{ env.VERSION }}
          path: dist/*

      - name: Publish GitHub Release
        if: github.ref_type == 'tag' || github.event.inputs.version != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = @"
          **$env:APP_NAME $env:VERSION**

          - **$env:APP_ID-Setup-$env:VERSION.exe** - installs for your user (no admin), adds Start menu shortcuts.
          - **$env:APP_ID-Portable-$env:VERSION.exe** - single EXE, no install. Keeps its data in a ``$env:APP_ID-data`` folder next to it.

          Needs Windows 10 or 11 (uses the built-in .NET Framework 4.8).
          Windows may show "Windows protected your PC" because the EXE is not code-signed: click **More info > Run anyway**.
          "@
          gh release create "v$env:VERSION" (Get-ChildItem dist\*).FullName --target $env:GITHUB_SHA --title "$env:APP_NAME $env:VERSION" --notes $notes
